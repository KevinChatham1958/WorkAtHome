name: Weekly new-gigs email

# Builds the weekly email (Gig of the Week in full + 7 more new gigs by name) from the gigs added in
# the past 7 days and hands it to Kit (secret KIT_API_KEY).
# MODE "draft" leaves it in Kit > Broadcasts for Kevin to check and send;
# "send" schedules it to all subscribers 10 minutes later.
# Runs Saturdays 9:17 am Buenos Aires time, and on demand (Actions tab).

on:
  schedule:
    - cron: '17 12 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'draft (Kevin sends it from Kit) or send (goes out automatically)'
        default: 'draft'
        type: choice
        options: [draft, send]

permissions:
  contents: write
  actions: write

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the email and send it to Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          # Scheduled runs use this default until Kevin approves automatic sending.
          MODE: ${{ inputs.mode || 'draft' }}
        run: python3 tools/weekly_email.py
      # A public copy of this week's email (newsletter/latest.html) is shown on the Subscribe
      # and "You're confirmed" pages. Commit it and deploy, like the view-count job.
      - name: Publish the sample on the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add newsletter/latest.html
          if git diff --cached --quiet; then
            echo "Sample unchanged"; exit 0
          fi
          git config user.name "weekly-email-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update newsletter sample (latest weekly email)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          gh workflow run deploy.yml --ref main
