name: Build creator directory

# Refreshes the data behind the unlisted creator directory page
# (/creator-directory/): every creator in the database, their channel facts,
# and their videos from the last 2 years (no Shorts), with ours marked.
# Runs Mondays after the view-count refresh, and on demand (Actions tab).
# Uses YOUTUBE_API_KEY; about 1,000-2,000 of YouTube's free 10,000 daily units.

on:
  schedule:
    - cron: '47 11 * * 1'   # Mondays 8:47 am Buenos Aires
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-directory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch from YouTube and build the directory data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/build_directory.py
      - name: Commit and deploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add creator-directory/creators.json creator-directory/videos.json data/video_channels.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "directory-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update creator directory data"
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done
          gh workflow run deploy.yml --ref main
