name: Update YouTube view counts

# Refreshes views.json (view counts for every gig's source video) and then
# deploys the site. Runs every Monday, whenever ideas.json changes (so new
# gigs get a count within minutes), and on demand from the Actions tab.
# Uses the YOUTUBE_API_KEY secret; costs about 12 of YouTube's free
# 10,000 daily units per run.

on:
  schedule:
    - cron: '17 11 * * 1'   # Mondays 11:17 UTC (8:17 am Buenos Aires)
  push:
    branches: [main]
    paths: [ideas.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-views
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch view counts from YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/update_views.py

      - name: Commit and deploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- views.json && git ls-files --error-unmatch views.json >/dev/null 2>&1; then
            echo "No change in view counts."; exit 0
          fi
          git config user.name "view-count-bot"
          git config user.email "actions@users.noreply.github.com"
          git add views.json
          git commit -m "Update YouTube view counts"
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done
          # A push made by this job doesn't start the deploy on its own, so start it.
          gh workflow run deploy.yml --ref main
